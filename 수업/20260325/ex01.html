<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #score {
            background-color: rgb(230, 230, 200);
            border: none;
            /* 테두리선 없애기 */
            border-bottom: 1px dotted rgb(10, 10, 10);
            /* 밑에 선 */
        }
    </style>
</head>

<body>
    <h1>성적확인</h1>
    <input type="text" name="" id="score" value="100">
    <button id="check">성적확인</button>
    <div id="print"></div>
</body>

</html>
<script>
    document.getElementById('check').onclick = function () {
        const num = document.getElementById('score').value;
        console.log(num);
        if(num >= 90 && num <= 100){
            document.getElementById('print').textContent = "A학점";
            console.log('A학점');
        }
        if(num >= 80 && num < 90){
            document.getElementById('print').textContent = "B학점";
            console.log('B학점');
        }
        if(num >= 70 && num < 80){
            document.getElementById('print').textContent = "C학점";
            console.log('C학점');
        }
        if(num >= 60 && num < 70){
            document.getElementById('print').textContent = "D학점";
            console.log('D학점');
        }
        if(num < 60){
            document.getElementById('print').textContent = "E학점";
            console.log('E학점');
        }
    }
</script>
